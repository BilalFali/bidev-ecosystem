services:
  - type: web
    name: bidev-tech-blog
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build:tech-blog
    startCommand: npm run start --workspace=apps/tech-blog
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_TECHBLOG_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_TECHBLOG_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_PUBLISHER_ID
        sync: false
